<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="命簿 — 你的命运之路">
<meta property="og:description" content="六道抉择，揭示你命中注定的道路">
<title>命簿 — 命运之书</title>
<style>
:root {
  --gold: #c9a84c;
  --gold2: #e8c870;
  --deep: #06060e;
  --purple: #1a0e2e;
  --purple2: #2d1b4e;
  --parchment: #f0e6c8;
  --glow: rgba(201,168,76,0.5);
  --glow2: rgba(201,168,76,0.2);
  --pink: #8b5cf6;
  --teal: #14b8a6;
  --rose: #f43f5e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--deep);
  color: var(--gold);
  font-family: "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
}

/* ── Star field ── */
#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.star {
  position: absolute; border-radius: 50%;
  background: #fff;
  animation: tw var(--d,3s) infinite ease-in-out var(--delay,0s);
}
@keyframes tw { 0%,100%{opacity:var(--o,0.1);transform:scale(1)} 50%{opacity:0.9;transform:scale(1.4)} }

/* Constellation lines */
#constellations { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.c-line { position: absolute; background: linear-gradient(90deg,transparent,var(--gold),transparent); height: 1px; opacity: 0; animation: fadeLine 3s infinite ease-in-out; }
@keyframes fadeLine { 0%,100%{opacity:0} 50%{opacity:0.3} }

/* Particle burst */
.particle {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 100;
  animation: particleFly 1s forwards ease-out;
}
@keyframes particleFly {
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}

/* Sections */
.section { display: none; position: relative; z-index: 10; min-height: 100vh; }
.section.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* Typography */
h1 { font-size: clamp(2.2rem,7vw,4rem); letter-spacing: 0.4em; text-shadow: 0 0 60px var(--glow),0 0 120px rgba(201,168,76,0.2); }
h2 { font-size: clamp(1.2rem,3vw,1.8rem); letter-spacing: 0.2em; }
p  { font-size: clamp(0.9rem,2vw,1.1rem); line-height: 2.2; letter-spacing: 0.05em; }

/* Orbs row */
.orbs { display: flex; gap: 12px; margin: 0.5em 0; }
.orb {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1px solid var(--gold);
  animation: orbBreathe 2s infinite ease-in-out;
  box-shadow: 0 0 8px var(--glow);
}
.orb:nth-child(2){animation-delay:0.35s}
.orb:nth-child(3){animation-delay:0.7s}
@keyframes orbBreathe {
  0%,100%{box-shadow:0 0 4px var(--glow2);transform:scale(1)}
  50%{box-shadow:0 0 18px var(--glow),0 0 30px var(--glow2);transform:scale(1.2)}
}

/* Divider */
.divider {
  width: 160px; height: 1px;
  background: linear-gradient(90deg,transparent,var(--gold),transparent);
  margin: 1em auto;
}

/* Ornament text */
.ornament { font-size: 1.8rem; letter-spacing: 0.6em; opacity: 0.5; }

/* ── HOME ── */
#home {
  text-align: center;
  background: radial-gradient(ellipse 80% 60% at 50% 40%,rgba(45,27,78,0.8) 0%,transparent 70%);
}
.star-symbol {
  font-size: 3rem; color: var(--gold);
  animation: starRotate 12s linear infinite;
  text-shadow: 0 0 40px var(--glow);
  margin-bottom: 1em;
}
@keyframes starRotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* Book animation */
.book-wrap {
  perspective: 800px;
  margin: 1.5em 0;
}
.book {
  width: 120px; height: 160px;
  position: relative;
  transform-style: preserve-3d;
  cursor: pointer;
  transition: transform 0.6s;
  animation: bookFloat 4s ease-in-out infinite;
}
.book:hover { transform: rotateY(-15deg) scale(1.05); }
@keyframes bookFloat {
  0%,100%{transform:translateY(0) rotateY(0deg)}
  50%{transform:translateY(-10px) rotateY(5deg)}
}
.book-cover {
  position: absolute; inset: 0;
  background: linear-gradient(135deg,#2d1b4e,#1a0e2e);
  border: 1px solid var(--gold);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  box-shadow: 0 0 30px rgba(201,168,76,0.2), inset 0 0 20px rgba(0,0,0,0.5);
}
.book-cover::before {
  content: '命';
  font-size: 3rem; letter-spacing: 0.2em;
  color: var(--gold); text-shadow: 0 0 20px var(--glow);
}
.book-spine {
  position: absolute; left: -8px; top: 0; bottom: 0; width: 8px;
  background: linear-gradient(to right,#1a0e2e,var(--purple));
  transform: rotateY(-90deg);
  transform-origin: right;
  border-radius: 2px 0 0 2px;
}

/* Fade-up animation */
@keyframes fadeUp {
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
.fade-up { opacity: 0; animation: fadeUp 0.8s forwards; }

/* CTA Button */
.btn {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: inherit;
  font-size: 1rem; letter-spacing: 0.3em;
  padding: 14px 48px; margin-top: 2em;
  cursor: pointer; transition: all 0.4s;
  text-transform: uppercase; position: relative; overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--gold); transform: scaleX(0);
  transform-origin: left; transition: transform 0.4s;
  z-index: -1;
}
.btn:hover::before { transform: scaleX(1); }
.btn:hover { color: var(--deep); box-shadow: 0 0 40px var(--glow); }

/* Ripple */
.ripple {
  position: absolute; border-radius: 50%;
  background: rgba(201,168,76,0.4);
  transform: scale(0); animation: rippleAnim 0.6s forwards;
  pointer-events: none;
}
@keyframes rippleAnim { to{transform:scale(4);opacity:0} }

/* ── QUIZ ── */
#quiz { max-width: 720px; margin: 0 auto; padding: 40px 20px; text-align: center; }

/* Progress constellation */
.progress-row {
  display: flex; justify-content: center; gap: 8px; margin-bottom: 3em;
}
.prog-node {
  display: flex; align-items: center; gap: 8px;
}
.prog-dot {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1px solid rgba(201,168,76,0.4);
  transition: all 0.5s;
}
.prog-dot.done {
  background: var(--gold); border-color: var(--gold);
  box-shadow: 0 0 10px var(--glow);
}
.prog-line {
  width: 30px; height: 1px;
  background: rgba(201,168,76,0.2);
  transition: background 0.5s;
}
.prog-line.done { background: var(--gold); box-shadow: 0 0 6px var(--glow2); }

.step-label {
  font-size: 0.75rem; letter-spacing: 0.4em;
  opacity: 0.5; margin-bottom: 1.5em;
  text-transform: uppercase;
}

/* Question card */
.q-card {
  border: 1px solid rgba(201,168,76,0.3);
  padding: 36px 28px;
  background: rgba(26,14,46,0.6);
  backdrop-filter: blur(8px);
  margin-bottom: 2em;
  position: relative;
  opacity: 0;
  transition: opacity 0.5s, border-color 0.5s;
}
.q-card.show {
  opacity: 1;
  border-color: rgba(201,168,76,0.6);
  box-shadow: 0 0 40px rgba(201,168,76,0.1);
}
.q-card::before, .q-card::after {
  content: '✦'; position: absolute;
  font-size: 0.8rem; color: var(--gold); opacity: 0.5;
}
.q-card::before { top: 10px; left: 12px; }
.q-card::after  { bottom: 10px; right: 12px; }
.q-text {
  font-size: clamp(1.1rem,3vw,1.5rem);
  line-height: 2; letter-spacing: 0.08em;
  color: var(--parchment);
}

/* Options */
.options { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 520px; margin: 0 auto; }
.opt {
  background: rgba(201,168,76,0.04);
  border: 1px solid rgba(201,168,76,0.25);
  color: var(--parchment);
  font-family: inherit; font-size: 1rem; letter-spacing: 0.1em;
  padding: 18px 24px; cursor: pointer;
  transition: all 0.35s;
  text-align: left;
  position: relative; overflow: hidden;
  opacity: 0; transform: translateX(-20px);
}
.opt.show { opacity: 1; transform: translateX(0); }
.opt::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--gold); transform: scaleY(0);
  transition: transform 0.3s;
}
.opt:hover {
  border-color: var(--gold);
  background: rgba(201,168,76,0.12);
  box-shadow: 0 0 20px rgba(201,168,76,0.15);
  transform: translateX(6px);
}
.opt:hover::before { transform: scaleY(1); }
.opt:active { transform: scale(0.98) translateX(6px); }
.opt-num {
  display: inline-block; width: 22px; height: 22px; line-height: 22px;
  text-align: center; border: 1px solid rgba(201,168,76,0.4);
  border-radius: 50%; font-size: 0.75rem; margin-right: 12px;
  transition: all 0.3s; flex-shrink: 0;
}
.opt:hover .opt-num {
  background: var(--gold); color: var(--deep);
  box-shadow: 0 0 10px var(--glow);
}

/* Score flash */
.score-flash {
  position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
  font-size: 1.2rem; letter-spacing: 0.3em;
  color: var(--gold); text-shadow: 0 0 20px var(--glow);
  opacity: 0; z-index: 200;
  pointer-events: none;
}
.score-flash.show { animation: flashUp 0.8s forwards; }
@keyframes flashUp {
  0%{opacity:0;transform:translateX(-50%) translateY(0)}
  30%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) translateY(-40px)}
}

/* ── RESULT ── */
#result { text-align: center; padding: 40px 20px; }
.result-title { margin-bottom: 2em; }
.result-sub { font-size: 0.8rem; letter-spacing: 0.5em; opacity: 0.5; margin-bottom: 1em; }

/* Path cards grid */
.paths-grid {
  display: grid; grid-template-columns: 1fr;
  gap: 16px; width: 100%; max-width: 600px; margin: 0 auto 2em;
}
@media(min-width:640px) {
  .paths-grid { grid-template-columns: repeat(3,1fr); }
}

.path-card {
  border: 1px solid rgba(201,168,76,0.2);
  padding: 24px 16px;
  background: rgba(26,14,46,0.5);
  position: relative;
  opacity: 0; transform: translateY(20px) scale(0.95);
  transition: all 0.6s;
  overflow: hidden;
}
.path-card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg,transparent 40%,rgba(201,168,76,0.05) 100%);
  pointer-events: none;
}
.path-card.show {
  opacity: 1; transform: translateY(0) scale(1);
}
.path-card.winner {
  border-color: var(--gold);
  box-shadow: 0 0 40px rgba(201,168,76,0.2);
}
.path-card.winner::after {
  content: '✦ 命定之路 ✦';
  position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
  background: var(--deep);
  padding: 0 12px;
  font-size: 0.65rem; letter-spacing: 0.3em;
  color: var(--gold); white-space: nowrap;
}
.p-icon { font-size: 1.8rem; margin-bottom: 0.5em; }
.p-name { font-size: 1.1rem; letter-spacing: 0.2em; margin-bottom: 0.3em; }
.p-type { font-size: 0.7rem; letter-spacing: 0.3em; opacity: 0.5; margin-bottom: 0.8em; }
.p-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.p-bar-bg { flex: 1; height: 3px; background: rgba(201,168,76,0.15); border-radius: 2px; overflow: hidden; }
.p-bar { height: 100%; background: var(--gold); border-radius: 2px; width: 0; transition: width 1s ease-out 0.5s; }
.p-pct { font-size: 0.8rem; letter-spacing: 0.1em; min-width: 36px; text-align: right; }
.path-card.winner .p-bar { background: linear-gradient(90deg,var(--gold),var(--gold2)); box-shadow: 0 0 8px var(--glow); }

/* Result description */
.result-desc {
  max-width: 500px; margin: 0 auto 2em;
  color: var(--parchment); line-height: 2; opacity: 0;
  transition: opacity 0.8s 1.5s;
}
.result-desc.show { opacity: 1; }
.result-quote {
  font-style: italic; opacity: 0.6;
  border-left: 2px solid var(--gold);
  padding-left: 1em; margin-bottom: 1.5em;
  text-align: left; opacity: 0; transition: opacity 0.8s 1.7s;
}
.result-quote.show { opacity: 0.6; }

/* Share area */
.share-area { opacity: 0; transition: opacity 0.8s 2s; text-align: center; }
.share-area.show { opacity: 1; }
.share-label { font-size: 0.75rem; letter-spacing: 0.4em; opacity: 0.5; margin-bottom: 0.8em; }
.share-url-box {
  display: flex; gap: 8px; max-width: 420px; margin: 0 auto 0.8em;
  align-items: stretch;
}
.share-url {
  flex: 1; background: rgba(201,168,76,0.08);
  border: 1px solid rgba(201,168,76,0.3);
  color: var(--parchment); font-family: inherit;
  font-size: 0.75rem; letter-spacing: 0.05em;
  padding: 10px 14px; outline: none;
  border-radius: 0; min-width: 0;
}
.share-url:focus { border-color: var(--gold); }
.btn-copy {
  background: var(--gold); color: var(--deep);
  border: none; font-family: inherit;
  font-size: 0.85rem; letter-spacing: 0.15em;
  padding: 10px 18px; cursor: pointer;
  transition: all 0.3s; white-space: nowrap;
}
.btn-copy:hover { box-shadow: 0 0 20px var(--glow); }
.btn-copy.copied { background: #14b8a6; }
.wechat-note { font-size: 0.7rem; opacity: 0.4; letter-spacing: 0.1em; }

.btn-reset { margin-top: 2em; opacity: 0; transition: opacity 0.8s 2.3s; }
.btn-reset.show { opacity: 1; }

/* ── Timeline ── */
#eventsTimeline {
  display: flex; flex-direction: column; gap: 0;
  max-width: 480px; margin: 2em auto 1em;
  position: relative;
}
#eventsTimeline::before {
  content: '';
  position: absolute; left: 62px; top: 10px; bottom: 10px;
  width: 1px; background: linear-gradient(to bottom,transparent,rgba(201,168,76,0.4),transparent);
}
.tl-item {
  display: grid; grid-template-columns: 56px 12px 1fr;
  gap: 0 16px; align-items: start;
  padding: 10px 0; opacity: 0; transform: translateX(-10px);
  transition: opacity 0.6s, transform 0.6s;
}
.tl-item.show { opacity: 1; transform: translateX(0); }
.tl-year { font-size: 0.72rem; letter-spacing: 0.1em; color: var(--gold); opacity: 0.7; padding-top: 3px; text-align: right; }
.tl-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold); margin-top: 5px;
  box-shadow: 0 0 8px var(--glow);
  position: relative; z-index: 1;
}
.tl-content { padding-bottom: 4px; }
.tl-title { font-size: 0.9rem; letter-spacing: 0.15em; color: var(--parchment); margin-bottom: 3px; }
.tl-desc { font-size: 0.8rem; line-height: 1.7; opacity: 0.55; letter-spacing: 0.03em; }

/* ── LOADING ── */
#loading {
  position: fixed; inset: 0; z-index: 999;
  background: var(--deep);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.8s;
}
#loading.hide { opacity: 0; pointer-events: none; }
.loading-rune {
  font-size: 3rem; color: var(--gold);
  animation: runeRotate 2s linear infinite;
  text-shadow: 0 0 40px var(--glow);
  margin-bottom: 1em;
}
@keyframes runeRotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.loading-text { font-size: 0.8rem; letter-spacing: 0.5em; opacity: 0.5; animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* ── Responsive ── */
@media(max-width:600px) {
  .q-card { padding: 24px 16px; }
  .opt { padding: 14px 16px; }
  .path-card { padding: 20px 12px; }
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="loading-rune">☽</div>
  <div class="loading-text">命运正在展开…</div>
</div>

<!-- Stars -->
<div id="stars"></div>

<!-- Constellation lines -->
<div id="constellations"></div>

<!-- Score flash -->
<div class="score-flash" id="scoreFlash"></div>

<!-- HOME -->
<section id="home" class="section active">
  <div class="ornament fade-up" style="animation-delay:0.1s">✦ &nbsp; ✦ &nbsp; ✦</div>
  <div class="orbs fade-up" style="animation-delay:0.25s"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
  <div class="star-symbol fade-up" style="animation-delay:0.35s">✧</div>
  <h1 class="fade-up" style="animation-delay:0.4s">命 簿</h1>
  <div class="divider fade-up" style="animation-delay:0.5s"></div>
  <h2 class="fade-up" style="animation-delay:0.6s">— 命运之书 —</h2>
  <p class="fade-up" style="animation-delay:0.75s">
    六道抉择，三条命途。<br>
    翻开命簿，窥见你命中注定的道路。
  </p>
  <div class="book-wrap fade-up" style="animation-delay:0.9s" onclick="app.start()">
    <div class="book">
      <div class="book-cover"></div>
      <div class="book-spine"></div>
    </div>
  </div>
  <p class="fade-up" style="animation-delay:1.1s;font-size:0.75rem;opacity:0.4;letter-spacing:0.3em">点击书本翻开命运</p>
  <div class="ornament fade-up" style="animation-delay:1.3s">✦ &nbsp; ✦ &nbsp; ✦</div>
</section>

<!-- QUIZ -->
<section id="quiz" class="section">
  <div class="progress-row" id="progressRow"></div>
  <div class="step-label" id="stepLabel"></div>
  <div class="q-card" id="qCard">
    <p class="q-text" id="qText"></p>
  </div>
  <div class="options" id="options"></div>
</section>

<!-- RESULT -->
<section id="result" class="section">
  <div class="result-sub">你的命运揭示</div>
  <h2 class="result-title">三条道路的命运权重</h2>
  <div class="divider"></div>
  <div class="paths-grid" id="pathsGrid"></div>
  <div class="result-desc" id="resultDesc"></div>
  <div id="eventsTimeline"></div>
  <div class="result-quote" id="resultQuote"></div>

  <div class="btn-reset" id="resetArea">
    <button class="btn" onclick="app.reset()">重新占卜</button>
  </div>
</section>

<script>
const QUES = [
  {
    text: "深夜独坐，你在思考的核心问题是：",
    options: [
      { text: "我如何才能抵达更远的地方？", trait: "ambition" },
      { text: "什么才是真正值得追寻的意义？", trait: "wisdom" },
      { text: "我该如何守护心中所爱之人？", trait: "devotion" },
    ]
  },
  {
    text: "面前出现三条岔路，你的目光首先落在：",
    options: [
      { text: "那条向上延伸、直入云端的光明坦途", trait: "ambition" },
      { text: "那条幽静深远、通往未知的幽暗小径", trait: "wisdom" },
      { text: "那条环绕家园、温暖绵长的小路", trait: "devotion" },
    ]
  },
  {
    text: "一位旅人向你问路，你更愿意：",
    options: [
      { text: "指引他走那条最快的路，成功指日可待", trait: "ambition" },
      { text: "与他结伴同行，一同在未知中寻找答案", trait: "wisdom" },
      { text: "带他回家，为他倒一杯热茶歇息", trait: "devotion" },
    ]
  },
  {
    text: "炉火旁摆着三件物品，你不由自主地拿起：",
    options: [
      { text: "一枚镶着宝石的印章，那是未来权力的象征", trait: "ambition" },
      { text: "一卷泛黄的羊皮书卷，古老的文字在暗中发光", trait: "wisdom" },
      { text: "一张褪色的家书，信纸上的泪痕依稀可见", trait: "devotion" },
    ]
  },
  {
    text: "占星师转动星盘，星光映照你的面容。你听到她说出：",
    options: [
      { text: "「王冠已在前方等候，只待你伸手去摘。」", trait: "ambition" },
      { text: "「真理如星辰遥远，但你的脚步从未停歇。」", trait: "wisdom" },
      { text: "「最珍贵的，从来都在你转身便能触及之处。」", trait: "devotion" },
    ]
  },
  {
    text: "推开命运之门前，你最后回望一眼。你看到的是：",
    options: [
      { text: "无数目光注视着你，等待你踏上巅峰", trait: "ambition" },
      { text: "无尽的星空与深渊，无声而浩瀚", trait: "wisdom" },
      { text: "一盏灯火在远方摇曳，那是等你归来的人", trait: "devotion" },
    ]
  },
];

const PATHS = {
  ambition: {
    icon: "\u2664",
    name: "璀璨星途",

你不怕未知，你怕的是「不知道为什么而活着」。真理是你唯一的故乡，哪怕那故乡永远在远方。`,
    quote: "「知道得越多，便越懂得世界的辽阔。」",
    events: [
      { year: "20岁", title: "第一次怀疑", desc: "你开始不相信教科书上的结论。你想知道，那些被忽略的细节里，藏着什么。" },
      { year: "26岁", title: "独自上路", desc: "你选择了那条人迹罕至的方向。朋友说你疯了，你知道自己心里在想什么。" },
      { year: "33岁", title: "深渊回望", desc: "你在某个深夜，读到了某段文字，整个人僵住了——那一刻，世界变得不一样了。" },

      { year: "44岁", title: "一盏灯亮了", desc: "有人读懂了你写的东西。Email里只有一句话：「原来不只是我这么想过。」你笑了。" },

这个世界用成就衡量人，但你知道有一种力量叫「有人在等你回家」。你守护的东西不闪耀，但它是所有人生命的底色。`,
    quote: "「爱是唯一在给予中不减反增的财富。」",
    events: [
      { year: "22岁", title: "第一次", desc: "你为了一个重要的人，放弃了一个重要的机会。你没后悔过。一秒都没有。" },
      { year: "28岁", title: "港湾", desc: "你把租来的小房子，变成了所有人想来坐坐的地方。沙发不够坐，就坐地上。" },
      { year: "35岁", title: "裂缝", desc: "你累了。你想过放手。但你做不到——因为你知道，如果你走了，有些人就真的没有人了。" },
      { year: "40岁", title: "彼此的光", desc: "你发现，被你守护的人，也在默默守护着你。你从来不是一个人在扛。" },
      { year: "47岁", title: "传承", desc: "有人叫你「师父」或「阿姨」。他们有了自己的家，在深夜打电话给你，像你当年陪他们一样。" },
      { year: "55岁", title: "窗边", desc: "你坐在窗边，外面下着雨。手机响了，是你记挂了很久的那个人：「妈，我到家了。」你笑了。" },
      { year: "65岁", title: "灯火不熄", desc: "一屋子人坐在你周围，都是你帮过的人。你不需要他们记得你——他们记得怎么对待别人就够了。" },
    ],
  },
};

const T_MAP = {0:{0:2,1:1,2:0},1:{0:2,1:1,2:0},2:{0:2,1:1,2:0},3:{0:2,1:1,2:0},4:{0:2,1:1,2:0},5:{0:2,1:1,2:0}};

const ICONS = { ambition: "♔", wisdom: "☽", devotion: "♥" };

// ── App ──────────────────────────────────────────
const app = {
  phase: "home",
  step: 0,
  scores: { ambition: 0, wisdom: 0, devotion: 0 },
  traits: [],

  init() {
    this.genStars();
    this.genConstellations();
    // Check for shared link
    const params = new URLSearchParams(location.search);
    if (params.has("r")) {
      const r = params.get("r");
      const s = params.get("s"); // e.g. "3-2-1"
      if (s) {
        const parts = s.split("-").map(Number);
        this.scores = { ambition: parts[0]||0, wisdom: parts[1]||0, devotion: parts[2]||0 };
      }
      // Auto-play loading then result
      setTimeout(() => {
        document.getElementById("loading").classList.add("hide");
        this.showResult(r);
      }, 1200);
    } else {
      document.getElementById("loading").classList.add("hide");
    }
  },

  start() {
    this.phase = "quiz";
    this.step = 0;
    this.scores = { ambition: 0, wisdom: 0, devotion: 0 };
    this.traits = [];
    this.showSection("quiz");
    this.renderQ();
    // Burst particles
    this.burstParticles(window.innerWidth/2, window.innerHeight/2, 20);
  },

  renderQ() {
    const q = QUES[this.step];
    // Progress
    const row = document.getElementById("progressRow");
    row.innerHTML = QUES.map((_, i) => `
      <div class="prog-node">
        <div class="prog-dot ${i < this.step ? "done" : ""} ${i === this.step ? "active" : ""}"></div>
        ${i < QUES.length-1 ? `<div class="prog-line ${i < this.step ? "done" : ""}"></div>` : ""}
      </div>
    `).join("");
    document.getElementById("stepLabel").textContent = `第 ${this.step+1} / ${QUES.length} 题`;
    // Card
    const card = document.getElementById("qCard");
    card.classList.remove("show");
    setTimeout(() => {
      document.getElementById("qText").textContent = q.text;
      card.classList.add("show");
    }, 50);
    // Options
    const $opts = document.getElementById("options");
    $opts.innerHTML = q.options.map((o, i) =>
      `<button class="opt" onclick="app.pick(${i},event)" style="transition-delay:${0.15+i*0.1}s">
        <span class="opt-num">${i+1}</span>${o.text}
      </button>`
    ).join("");
    // Stagger show
    requestAnimationFrame(() => {
      $opts.querySelectorAll(".opt").forEach(el => el.classList.add("show"));
    });
  },

  pick(i, e) {
    const q = QUES[this.step];
    const t = q.options[i].trait;
    this.scores[t]++;
    this.traits.push(t);

    // Ripple effect
    if (e) this.addRipple(e.currentTarget, e);
    // Score flash
    this.flashScore(t);
    // Particle burst
    this.burstParticles(e.clientX, e.clientY, 12);

    this.step++;
    if (this.step < QUES.length) {
      setTimeout(() => this.renderQ(), 400);
    } else {
      setTimeout(() => this.finish(), 600);
    }
  },

  finish() {
    const sorted = Object.entries(this.scores).sort((a,b) => b[1]-a[1]);
    this.mainPath = sorted[0][0];
    const total = sorted[0][1] + sorted[1][1] + sorted[2][1];
    this.pcts = {
      ambition: Math.round(this.scores.ambition / total * 100),
      wisdom:   Math.round(this.scores.wisdom   / total * 100),
      devotion: Math.round(this.scores.devotion / total * 100),
    };
    // Fix rounding to always sum 100
    const sum = this.pcts.ambition + this.pcts.wisdom + this.pcts.devotion;
    if (sum !== 100) this.pcts[this.mainPath] += (100 - sum);

    this.buildShareUrl();
    this.showSection("result");
    this.renderResult();
  },

  renderResult() {
    const sorted = Object.entries(this.scores).sort((a,b) => b[1]-a[1]);
    const grid = document.getElementById("pathsGrid");
    grid.innerHTML = sorted.map(([key, score], i) => {
      const p = PATHS[key];
      const pct = this.pcts[key];
      const isWinner = key === this.mainPath;
      return `
        <div class="path-card ${isWinner ? "winner" : ""}" id="pc_${key}" style="transition-delay:${0.3+i*0.2}s">
          <div class="p-icon">${p.icon}</div>
          <div class="p-name">${p.name}</div>
          <div class="p-type">${p.type}</div>
          <div class="p-bar-wrap">
            <div class="p-bar-bg"><div class="p-bar" id="pb_${key}" data-pct="${pct}"></div></div>
            <div class="p-pct" id="pp_${key}">${pct}%</div>
          </div>
        </div>`;
    }).join("");

    // Stagger card reveal
    requestAnimationFrame(() => {
      sorted.forEach(([key], i) => {
        setTimeout(() => {
          document.getElementById("pc_"+key).classList.add("show");
          // Animate bar after card shows
          setTimeout(() => {
            const bar = document.getElementById("pb_"+key);
            bar.style.width = bar.dataset.pct + "%";
            this.burstParticles(
              bar.getBoundingClientRect().left + bar.offsetWidth,
              bar.getBoundingClientRect().top + bar.offsetHeight/2,
              5
            );
          }, 200);
        }, i * 250);
      });
    });

    // Description & quote
    const main = PATHS[this.mainPath];
    const desc = document.getElementById("resultDesc");
    const quote = document.getElementById("resultQuote");
    desc.innerHTML = main.desc.split("\n\n").map(p => `<p style="margin-bottom:1em">${p}</p>`).join("");
    quote.textContent = main.quote;

    // Render events timeline
    const tl = document.getElementById("eventsTimeline");
    if (tl) {
      tl.innerHTML = main.events.map((ev, i) => `
        <div class="tl-item" style="animation-delay:${1.8+i*0.15}s">
          <div class="tl-year">${ev.year}</div>
          <div class="tl-dot"></div>
          <div class="tl-content">
            <div class="tl-title">${ev.title}</div>
            <div class="tl-desc">${ev.desc}</div>
          </div>
        </div>`).join("");
      setTimeout(() => tl.querySelectorAll(".tl-item").forEach(el => el.classList.add("show")), 1800);
    }

    // Reveal desc/quote
    setTimeout(() => {
      desc.classList.add("show");
      quote.classList.add("show");
      document.getElementById("resetArea").classList.add("show");
      // Big burst
      this.burstParticles(window.innerWidth/2, window.innerHeight/2, 30);
    }, 1200);
  },

  showResult(mainPath) {
    this.mainPath = mainPath;
    const total = this.scores.ambition + this.scores.wisdom + this.scores.devotion;
    this.pcts = {
      ambition: Math.round(this.scores.ambition / total * 100),
      wisdom:   Math.round(this.scores.wisdom   / total * 100),
      devotion: Math.round(this.scores.devotion / total * 100),
    };
    this.showSection("result");
    this.renderResult();
  },

  reset() {
    this.phase = "home";
    this.mainPath = null;
    document.querySelectorAll(".path-card").forEach(el => el.classList.remove("show"));
    document.getElementById("resultDesc").classList.remove("show");
    document.getElementById("resultQuote").classList.remove("show");
    document.getElementById("resetArea").classList.remove("show");
    document.querySelectorAll(".p-bar").forEach(el => { el.style.width = "0"; });
    this.showSection("home");
    // Clear URL params
    history.replaceState({}, "", location.pathname);
    this.burstParticles(window.innerWidth/2, window.innerHeight/2, 15);
  },

  showSection(id) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  },

  // ── Effects ──────────────────────────────────────
  genStars() {
    const c = document.getElementById("stars");
    for (let i = 0; i < 160; i++) {
      const s = document.createElement("div");
      s.className = "star";
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;` +
        `width:${size}px;height:${size}px;` +
        `--d:${Math.random()*5+2}s;--delay:${Math.random()*5}s;--o:${Math.random()*0.4+0.05}`;
      c.appendChild(s);
    }
  },

  genConstellations() {
    const c = document.getElementById("constellations");
    for (let i = 0; i < 6; i++) {
      const line = document.createElement("div");
      line.className = "c-line";
      const x1 = Math.random()*70+10, y1 = Math.random()*70+10;
      const x2 = x1 + (Math.random()*30-15), y2 = y1 + (Math.random()*30-15);
      const angle = Math.atan2(y2-y1, x2-x1) * 180/Math.PI;
      const length = Math.sqrt((x2-x1)**2+(y2-y1)**2);
      line.style.cssText = `left:${x1}%;top:${y1}%;width:${length}%;transform:rotate(${angle}deg);animation-delay:${i*0.5}s`;
      c.appendChild(line);
    }
  },

  flashScore(trait) {
    const labels = { ambition: "✦ 璀璨之路 ✦", wisdom: "✧ 智慧之路 ✧", devotion: "♥ 守护之路 ♥" };
    const el = document.getElementById("scoreFlash");
    el.textContent = labels[trait];
    el.style.color = trait === "ambition" ? "var(--gold2)" : trait === "wisdom" ? "#c4b5fd" : "var(--rose)";
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
  },

  burstParticles(x, y, count) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      const size = Math.random() * 6 + 3;
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 80 + 30;
      p.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;` +
        `background:${Math.random()>0.5?"var(--gold)":Math.random()>0.5?"#c4b5fd":"var(--rose)"};` +
        `--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  },

  addRipple(el, e) {
    const r = document.createElement("span");
    r.className = "ripple";
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;`;
    el.appendChild(r);
    setTimeout(() => r.remove(), 600);
  },
};

app.init();
</script>
